[project]
name = "skygeni-sales-intelligence"
version = "0.1.0"
description = "SkyGeni Sales Intelligence System — Win Rate Driver Analysis"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "nbformat>=5.9.0",
    "black>=26.1.0",
    "ruff>=0.15.0",
    "langchain-groq>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
